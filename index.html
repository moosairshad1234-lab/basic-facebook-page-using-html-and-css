```html
<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="left">

            <h1>facebook</h1>

            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>

        </div>


        <div class="right">

            <div class="login-box">

                <input
                    type="text"
                    placeholder="Email address or phone number"
                >

                <input
                    type="password"
                    placeholder="Password"
                >

                <button class="login">
                    Log In
                </button>

                <a href="#">
                    Forgotten password?
                </a>

                <hr>

                <button class="create">
                    Create new account
                </button>

            </div>

            <p class="bottom">
                <b>Create a Page</b> for a celebrity, brand or business.
            </p>

        </div>

    </div>

</body>
</html>
